<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <radialGradient id="spkCone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="spkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Speaker Outer Mount Flange -->
  <circle cx="100" cy="80" r="65" fill="#1E293B" filter="url(#spkShadow)" stroke="#475569" stroke-width="2"/>
  <circle cx="100" cy="80" r="58" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <!-- Rubber Surround -->
  <circle cx="100" cy="80" r="50" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Cone -->
  <circle cx="100" cy="80" r="42" fill="url(#spkCone)" stroke="#0F172A" stroke-width="1"/>
  <!-- Center Coaxial Tweeter Bridge -->
  <line x1="68" y1="80" x2="132" y2="80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="80" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="100" cy="80" r="7" fill="#0F172A"/>
  <!-- Screws on Mount Flange -->
  <circle cx="100" cy="22" r="3" fill="#94A3B8"/>
  <circle cx="100" cy="138" r="3" fill="#94A3B8"/>
  <circle cx="42" cy="80" r="3" fill="#94A3B8"/>
  <circle cx="158" cy="80" r="3" fill="#94A3B8"/>
</svg>
