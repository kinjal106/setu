<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g17Chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Wire cable hanging to bottom left -->
  <path d="M 80 114 C 80 134, 62 144, 52 154" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Wire relief collar -->
  <rect x="76" y="110" width="8" height="6" rx="2" fill="#334155" />

  <!-- Main Capsule Body -->
  <rect x="56" y="24" width="48" height="90" rx="14" fill="url(#g17Chassis)" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Subtle inner edge highlight -->
  <rect x="58" y="26" width="44" height="86" rx="12" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.4"/>

  <!-- Center Indicator Dot (Purple) -->
  <circle cx="80" cy="48" r="3.2" fill="#A855F7" filter="url(#purpleGlow)"/>
  <!-- Status slot -->
  <rect x="78" y="58" width="4" height="1.8" rx="0.9" fill="#475569" opacity="0.8"/>
</svg>
