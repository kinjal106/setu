    <path d="M 30,50 C 40,25 160,25 170,50 L 175,70 C 175,85 165,95 155,95 L 45,95 C 35,95 25,85 25,70 Z" fill="url(#boschBlue)" filter="url(#bpadShadow)" stroke="#60A5FA" stroke-width="1.5"/>
