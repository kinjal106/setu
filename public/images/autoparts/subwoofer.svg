<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="subCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="dustCap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <filter id="subShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Basket / Frame -->
  <rect x="25" y="15" width="150" height="130" rx="14" fill="#0F172A" filter="url(#subShadow)" stroke="#334155" stroke-width="2"/>
  <!-- Bass reflex port -->
  <circle cx="145" cy="40" r="14" fill="#020617" stroke="#1E293B" stroke-width="2"/>
  <circle cx="145" cy="40" r="11" fill="#0F172A"/>
  <!-- Subwoofer Outer Rim -->
  <circle cx="90" cy="85" r="50" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <!-- Rubber Surround -->
  <circle cx="90" cy="85" r="44" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Cone -->
  <circle cx="90" cy="85" r="38" fill="url(#subCone)" stroke="#0F172A" stroke-width="1"/>
  <!-- Dust Cap -->
  <circle cx="90" cy="85" r="16" fill="url(#dustCap)" stroke="#0284C7" stroke-width="1.5"/>
  <!-- Brand accent text -->
  <text x="90" y="88" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SUB</text>
  <!-- Screws -->
  <circle cx="90" cy="38" r="2" fill="#94A3B8"/>
  <circle cx="90" cy="132" r="2" fill="#94A3B8"/>
  <circle cx="43" cy="85" r="2" fill="#94A3B8"/>
  <circle cx="137" cy="85" r="2" fill="#94A3B8"/>
</svg>
