<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ampHeatsink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="ampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main Heat-sink Chassis -->
  <rect x="25" y="30" width="150" height="100" rx="8" fill="url(#ampHeatsink)" filter="url(#ampShadow)" stroke="#475569" stroke-width="1.5"/>
  <!-- Heatsink Fins -->
  <line x1="45" y1="30" x2="45" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="60" y1="30" x2="60" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="75" y1="30" x2="75" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="90" y1="30" x2="90" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="105" y1="30" x2="105" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="120" y1="30" x2="120" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="135" y1="30" x2="135" y2="130" stroke="#0F172A" stroke-width="2"/>
  <line x1="150" y1="30" x2="150" y2="130" stroke="#0F172A" stroke-width="2"/>
  <!-- Top Center Badge Plate -->
  <rect x="65" y="65" width="70" height="30" rx="4" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="100" y="80" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">4-CH AMP</text>
  <text x="100" y="90" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#94A3B8" text-anchor="middle">1000 WATTS</text>
  <!-- Power LED -->
  <circle cx="125" cy="72" r="2.5" fill="#22C55E"/>
</svg>
